[workspace]
resolver = "2"
members = ["shared", "ffi", "tools/course_builder", "tools/uniffi_bindgen_swift", "web"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
shared = { path = "shared" }
tokio = { version = "1.52.*", default-features = false }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
serde_path_to_error = "0.1.*"
sha2 = "0.10.*"
clap = { version = "4.6.*", features = ["derive"] }
log = "0.4.*"
env_logger = "0.11.*"
minimer = "2.2.*"
chrono = { version = "0.4.*", features = ["serde"] }
tempfile = "3.27.*"
espeak-rs-sys = { version = "0.2.*", features = ["compile-espeak-intonations"] }
brotli = "8.0.*"
futures-util = { version = "0.3.*", default-features = false }
reqwest = { version = "0.13.*", default-features = false, features = ["native-tls"] }
uniffi = "0.32.*"
rusqlite = { version = "0.32.*", features = ["bundled"] }
sqlite-wasm-rs = { version = "0.4.*", default-features = false, features = ["precompiled"] }
aws-sdk-s3 = "1.152.*"
aws-config = "1.12.*"
aws-smithy-runtime-api = { version = "1.19.*", features = ["client"] }
dotenvy = "0.15.*"
secr = "1.2.*"
base64 = "0.22.*"
tower-http = { version = "0.6.*", default-features = false, features = ["fs"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

# web client (Leptos/WASM); consumed by the web/ crate
leptos = "0.8.*"
leptos_router = "0.8.*"
leptos_meta = "0.8.*"
any_spawner = { version = "0.3.*", features = ["tokio"] }
leptos_axum = "0.8.*"
axum = "0.8.*"
wasm-bindgen = "0.2.*"
wasm-bindgen-futures = "0.4.*"
js-sys = "0.3.*"
web-sys = "0.3.*"
console_log = "0.2.*"
console_error_panic_hook = "0.1.*"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Shard compression runs at brotli's highest quality, which is impractically slow unoptimized.
[profile.dev.package.brotli]
opt-level = 3
