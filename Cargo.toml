[workspace]
resolver = "2"
members = ["shared", "tools/course_builder", "web"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
shared = { path = "shared" }
tokio = { version = "1.52.*", default-features = false }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
serde_path_to_error = "0.1.*"
sha2 = "0.10.*"
clap = { version = "4.6.*", features = ["derive"] }
log = "0.4.*"
env_logger = "0.11.*"
minimer = "2.1.*"
chrono = { version = "0.4.*", features = ["serde"] }
tempfile = "3.27.*"
espeak-rs-sys = { version = "0.2.*", features = ["compile-espeak-intonations"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

# web client (Leptos/WASM); consumed by the web/ crate
leptos = "0.8.*"
leptos_router = "0.8.*"
leptos_meta = "0.8.*"
any_spawner = { version = "0.3.*", features = ["tokio"] }
leptos_axum = "0.8.*"
axum = "0.8.*"
wasm-bindgen = "0.2.*"
wasm-bindgen-futures = "0.4.*"
js-sys = "0.3.*"
web-sys = "0.3.*"
console_log = "0.2.*"
console_error_panic_hook = "0.1.*"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
