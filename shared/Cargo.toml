[package]
name = "shared"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
minimer = { workspace = true }
log = { workspace = true }
futures-util = { workspace = true }
brotli = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# bundles a C SQLite which needs libc; `serialize` adds Connection::deserialize
rusqlite = { workspace = true, features = ["serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# the SQLite the shard reader's read-only memory VFS registers against; rusqlite does not build for wasm32
sqlite-wasm-rs = { workspace = true }
