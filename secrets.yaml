# Encrypted secret store. Each entry is the YAML serialization of a secr-encrypted ciphertext under the master key
# in `.env`'s MASTER_SECRET. Commit this file; the contents are encrypted.
#
# Add a secret:
#   secr encrypt --key "$MASTER_SECRET" --name <name> <plaintext>
# then paste the YAML block into this file.
#
# Secrets read by course_builder:
#   cloudflare.r2.publish.secret_access_key
