name: Language
options:
  bundleIdPrefix: ro.zach
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The origin that serves /discovery; the simulator reaches the Mac's own server here.
    LANGUAGE_ORIGIN: "http://127.0.0.1:3000"
    # Where the latest manifest is looked for when discovery cannot be read, and the embedded bundle's recordings.
    LANGUAGE_REPOSITORY_BASE_URL: "http://127.0.0.1:3002"
targets:
  Language:
    type: application
    platform: iOS
    sources:
      - path: Language
        excludes:
          - Resources/embedded_bundle
      - path: Language/Resources/embedded_bundle
        type: folder
        buildPhase: resources
      - path: ../target/uniffi/swift
    dependencies:
      - framework: ../target/uniffi/LanguageCore.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    info:
      path: Language/Info.plist
      properties:
        CFBundleDisplayName: Language
        CFBundleLocalizations: ["en"]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        LanguageOrigin: $(LANGUAGE_ORIGIN)
        LanguageRepositoryBaseUrl: $(LANGUAGE_REPOSITORY_BASE_URL)
        NSLocalNetworkUsageDescription: The course is downloaded from a server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.zach.language
        DEVELOPMENT_TEAM: G8FCX75H8W
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the Rust core
        script: /usr/bin/env -i HOME="${HOME}" PATH="${HOME}/.cargo/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" "${SRCROOT}/../scripts/ios/build-ios-core.sh"
        basedOnDependencyAnalysis: false
      - name: Sync the embedded bundle
        script: "\"${SRCROOT}/../scripts/ios/sync-ios-embedded-bundle.sh\""
        basedOnDependencyAnalysis: false
  LanguageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LanguageTests
    dependencies:
      - target: Language
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.zach.language.tests
        GENERATE_INFOPLIST_FILE: true
  LanguageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LanguageUITests
    dependencies:
      - target: Language
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.zach.language.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Language
schemes:
  Language:
    build:
      targets:
        Language: all
    test:
      targets:
        - LanguageTests
        - LanguageUITests
